<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双花瓣配电网 · 可编辑 / 可仿真原型</title>
<style>
  :root{--ink:#12263f;--muted:#5b7083;--a:#1d4ed8;--b:#0d9488;--tie:#e8590c;
        --sub:#334155;--bg:#eaeff6;--live:#0f8a4a;--dead:#b9c4d2;--line:#e6ebf2;}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);overflow:hidden;
    font:13px/1.55 -apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif}
  .pane{background:#fff;border-radius:13px;box-shadow:0 6px 20px rgba(18,38,63,.09)}
  .app{height:100dvh;display:flex;flex-direction:column;gap:9px;padding:11px 13px}
  .topbar{padding:9px 15px 10px;display:flex;flex-direction:column;gap:8px}
  .hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;letter-spacing:.3px;display:flex;align-items:center;gap:9px;white-space:nowrap}
  h1::before{content:'';width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,#1d4ed8,#0d9488)}
  .sub{color:var(--muted);font-size:11.5px;flex:1;min-width:220px}
  .sub code{background:#f1f5fa;border-radius:4px;padding:1px 5px;color:#33465c}
  h1+.sub{margin:0}
  .tags{display:flex;gap:7px;flex-wrap:wrap}
  .tag{display:flex;gap:6px;align-items:center;border:1px solid #e4eaf3;background:#f8fafc;
    border-radius:999px;padding:3px 11px;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .tag b{color:var(--ink);font-size:12.5px}
  .tag i{font-style:normal;width:6px;height:6px;border-radius:50%;background:#9fb0c4}
  .tag.ok{border-color:#cfe9db;background:#f1faf5}.tag.ok i{background:var(--live)}.tag.ok b{color:#0b6b3a}
  .tag.bad{border-color:#f6d5d5;background:#fdf4f4}.tag.bad i{background:#d6336c;animation:fltpulse 1.1s infinite}.tag.bad b{color:#c2255c}
  .tag.warn{border-color:#f3e2c4;background:#fdf9f0}.tag.warn i{background:#e8590c}.tag.warn b{color:#b8730b}
  .tag.act{border-color:#cddcf5;background:#f2f7ff}.tag.act i{background:#1d4ed8}
  .bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  button{border:1px solid #cfd8e3;background:#f8fafc;border-radius:8px;padding:5px 11px;
    cursor:pointer;font-size:12.5px;color:var(--ink);white-space:nowrap}
  button:hover{background:#eef3fa;border-color:#b9c6d6}
  button.mini{padding:1px 8px;font-size:11.5px;border-radius:6px;line-height:1.7}
  button.primary{background:#12263f;border-color:#12263f;color:#fff}
  button.primary:hover{background:#1d3557}
  .sep{width:1px;height:20px;background:#e6ebf2;margin:0 3px}
  .ctl{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:11.5px;white-space:nowrap}
  .ctl input[type=range]{width:104px;accent-color:#1d4ed8}
  .ctl b{color:var(--ink);font-size:12px;min-width:32px;text-align:right}
  .hint{color:var(--muted);font-size:11.5px;margin-left:auto;white-space:nowrap}
  .mid{flex:1;min-height:0;display:grid;grid-template-columns:292px minmax(0,1fr) 338px;gap:9px}
  .mid.focus{grid-template-columns:minmax(0,1fr)}
  .mid.focus .side{display:none}
  .side{display:flex;flex-direction:column;gap:9px;min-height:0;overflow:auto;padding-right:2px}
  .side::-webkit-scrollbar{width:8px}
  .side::-webkit-scrollbar-thumb{background:#d3dce7;border-radius:4px}
  .box{padding:10px 13px;flex:0 0 auto}
  .box>b{display:block;margin:0 0 8px;padding-bottom:6px;font-size:12.5px;color:var(--ink);
    border-bottom:1px solid #eef1f6}
  .box>b::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
    background:#1d4ed8;margin-right:7px;vertical-align:1px}
  .stage{padding:7px;display:flex;min-height:0}
  svg.d{flex:1;width:100%;height:100%;min-height:0;display:block;background:#fdfeff;
    border:1px solid var(--line);border-radius:9px;touch-action:none;user-select:none;cursor:default}
  .foot{padding:7px 15px;display:flex;gap:10px;align-items:center;font-size:12.5px;min-height:36px}
  .foot .t{color:#c92a2a;font-weight:700;white-space:nowrap}
  .foot .msg{color:var(--muted);flex:1}
  /* ── 菜单栏 ── */
  .menubar{padding:6px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;white-space:nowrap;
    letter-spacing:.2px}
  .brand::before{content:'';width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,#1d4ed8,#0d9488)}
  .brand em{font-style:normal;font-weight:500;font-size:11px;color:var(--muted);margin-left:1px}
  nav.mn{display:flex;gap:1px}
  .mnu{border:1px solid transparent;background:none;padding:4px 10px;border-radius:7px;font-size:12.5px;color:#33465c}
  .mnu:hover{background:#eef3fa}
  .mnu.on{background:#12263f;color:#fff;border-color:#12263f}
  .qk{display:flex;gap:6px;align-items:center}
  .menu{position:fixed;z-index:70;display:none;min-width:216px;padding:5px;background:#fff;
    border:1px solid #d7dfe9;border-radius:10px;box-shadow:0 12px 30px rgba(18,38,63,.18)}
  .menu button{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;border:0;
    background:none;padding:6px 10px;border-radius:6px;font-size:12.5px;color:var(--ink);cursor:pointer}
  .menu button:hover{background:#eef3fa}
  .menu button.on{background:#eef3fa;font-weight:700}
  .menu button .k{color:#9aa9bb;font-size:11px;white-space:nowrap}
  .menu .hd{padding:5px 10px 6px;font-size:11px;color:var(--muted);border-bottom:1px solid #eef1f6;margin-bottom:4px}
  .menu hr{border:0;border-top:1px solid #eef1f6;margin:4px 6px}

  /* ── 画布缩放条 ── */
  .stage{position:relative}
  .zoombar{position:absolute;right:15px;bottom:15px;display:flex;gap:2px;align-items:center;
    background:rgba(255,255,255,.95);border:1px solid #e2e8f1;border-radius:10px;padding:3px 5px;
    box-shadow:0 5px 16px rgba(18,38,63,.12);font-size:11.5px;color:var(--muted);z-index:5}
  .zoombar button{border:0;background:none;padding:2px 7px;border-radius:6px;font-size:13px;
    line-height:1.5;color:#33465c;cursor:pointer}
  .zoombar button:hover{background:#eef3fa}
  .zoombar .lv{min-width:44px;text-align:center;color:var(--ink);font-weight:700;font-size:11.5px;cursor:pointer}

  /* ── 底部状态栏 ── */
  .foot{padding:8px 14px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:6px 18px;
    font-size:12px;align-items:start}
  .foot .fcol{min-width:0;display:flex;flex-direction:column;gap:6px}
  .foot .fcol>b{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px}
  .foot .ftop{display:flex;gap:9px;align-items:baseline;min-width:0}
  .foot .t{color:#c92a2a;font-weight:700;white-space:nowrap;font-size:11.5px}
  .foot .msg{color:#33465c;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chks{display:flex;flex-wrap:wrap;gap:5px 7px}
  .chks .al{display:inline-flex;gap:5px;align-items:center;padding:2px 9px;border-radius:999px;
    border:1px solid #e6ebf2;background:#f8fafc;color:var(--muted);font-size:11px;white-space:nowrap}
  .chks .al::before{content:'';width:5px;height:5px;border-radius:50%;background:#9fb0c4;flex:0 0 auto}
  .chks .al.ok{border-color:#cfe9db;background:#f1faf5;color:#0b6b3a}
  .chks .al.ok::before{background:var(--live)}
  .chks .al.warn{border-color:#f3e2c4;background:#fdf9f0;color:#a8630b}
  .chks .al.warn::before{background:#e8590c}
  .chks .al.bad{border-color:#f6d5d5;background:#fdf4f4;color:#c2255c}
  .chks .al.bad::before{background:#d6336c}

  /* ── 动作过程面板 ── */
  .act .ph{color:var(--muted);font-size:11.5px}
  .act .st{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #eef1f6}
  .act .st:last-child{border-bottom:0}
  .act .no{flex:0 0 auto;width:19px;height:19px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;background:#c3cdda;margin-top:1px}
  .act .no.n1{background:var(--flt)}.act .no.n2{background:var(--tie)}.act .no.n3{background:var(--live)}
  .act .tx{min-width:0;font-size:11.5px;line-height:1.55;color:var(--ink)}
  .act .tx b{display:block;font-size:11.5px;color:inherit}
  .act .tx em{font-style:normal;color:var(--muted)}
  .act .st.off .tx,.act .st.off .no{opacity:.45}
  .act .ft{margin-top:7px;padding-top:7px;border-top:1px solid #eef1f6;font-size:11.5px;font-weight:700}

  /* ── 对话框 ── */
  .dlg{position:fixed;inset:0;z-index:90;display:none;background:rgba(18,38,63,.28);
    align-items:center;justify-content:center}
  .dlg.on{display:flex}
  .dlgbox{width:min(620px,92vw);max-height:82vh;display:flex;flex-direction:column;background:#fff;
    border-radius:14px;box-shadow:0 24px 60px rgba(18,38,63,.3);overflow:hidden}
  .dlghd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 15px;
    border-bottom:1px solid #eef1f6;font-size:13.5px}
  .dlghd button{border:0;background:none;font-size:13px;color:var(--muted);cursor:pointer;padding:2px 7px;border-radius:6px}
  .dlghd button:hover{background:#eef3fa}
  .dlgbody{padding:13px 16px;overflow:auto;font-size:12.5px;line-height:1.75;color:#33465c}
  .dlgbody h4{margin:12px 0 6px;font-size:12.5px;color:var(--ink)}
  .dlgbody h4:first-child{margin-top:0}
  .dlgbody table{width:100%;border-collapse:collapse;font-size:12px}
  .dlgbody td{padding:4px 8px;border-bottom:1px solid #f1f5fa}
  .dlgbody td.k{white-space:nowrap;color:#12263f;font-weight:700;width:126px}
  .dlgbody code{background:#f1f5fa;border-radius:4px;padding:1px 5px}
  .saveitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid #f1f5fa}
  .saveitem small{color:var(--muted)}

  /* ── 拓扑模板 ── */
  .topos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .topos button{position:relative;text-align:left;padding:7px 9px;border-radius:9px;line-height:1.35;font-size:12px}
  .topos button small{display:block;color:var(--muted);font-size:10px;font-weight:400}
  .topos button.cur{background:#12263f;border-color:#12263f;color:#fff}
  .topos button.cur small{color:#b9c9dd}

  /* ── 工作台自适应：中小屏自动收窄侧栏、压缩顶栏，保证一屏放得下 ── */
  @media (max-width:1680px){ .mid{grid-template-columns:268px minmax(0,1fr) 312px} }
  @media (max-width:1500px){
    .mid{grid-template-columns:250px minmax(0,1fr) 292px}
    .box{padding:9px 11px}
    .legend{grid-template-columns:1fr;gap:5px}
    .legend span{font-size:10.5px}
  }
  @media (max-width:1330px){ .mid{grid-template-columns:228px minmax(0,1fr) 264px} .hint{display:none} }
  @media (max-height:880px){
    .app{gap:7px;padding:9px 11px}
    .topbar{padding:7px 12px 8px;gap:6px}
    h1{font-size:15.5px}
    .foot{min-height:31px;padding:5px 12px;font-size:12px}
    .stage{padding:6px}
  }
  @media (max-width:1500px){ .foot{grid-template-columns:minmax(0,1fr)} }
  @media (max-height:790px){
    .sub{display:none}
    .tags{gap:6px}
    .tag{padding:2px 9px}
    h1{font-size:15px}
  }
  select{font:inherit;font-size:12.5px;border:1px solid #cfd8e3;background:#f8fafc;width:100%;
    border-radius:8px;padding:5px 8px;color:var(--ink)}
  .tl{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .tl .chip{padding:4px 10px;border-radius:8px;border:1px solid #e6ebf2;background:#f8fafc;
    color:var(--muted);font-size:11.5px}
  .tl .chip.on{background:#12263f;border-color:#12263f;color:#fff;font-weight:700}
  .tl .chip.done{background:#e8f5ee;border-color:#bcdfcd;color:#0f8a4a}
  .tlmsg{margin-top:7px;color:var(--muted);font-size:11.5px}
  .impbox{display:none;margin-top:8px}
  .impbox textarea{width:100%;height:76px;border:1px solid #cfd8e3;border-radius:8px;padding:7px 9px;
    font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
  .improw{display:flex;gap:7px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;font-size:11px;color:var(--muted)}
  .legend span{display:flex;gap:6px;align-items:center}
  .ok{color:var(--live)}.bad{color:#d6336c}.warn{color:#b8730b}
  .kv{color:var(--muted);font-size:12px;margin:3px 0}
  .kv i{font-style:normal;color:var(--ink);font-weight:600}
  .row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
  .row input[type=text]{border:1px solid #cfd8e3;border-radius:6px;padding:3px 8px;
    font:inherit;font-size:12.5px;width:120px}
  .sw{display:flex;justify-content:space-between;gap:8px;padding:3px 0;
    border-bottom:1px dashed #eef1f6;align-items:center}
  .sw:last-child{border-bottom:0}
  .sw em{font-style:normal;color:var(--muted);font-size:11px}
  .sw .nm{min-width:70px}
  @keyframes flowdash{to{stroke-dashoffset:-28}}
  .flow{stroke-dasharray:2 26;animation:flowdash 1.3s linear infinite}
  .flow.rev{animation-direction:reverse}
  @keyframes fltpulse{0%,100%{opacity:1}50%{opacity:.45}}
  .fltpulse{animation:fltpulse 1.1s ease-in-out infinite}
  .ctx{position:fixed;z-index:60;display:none;min-width:176px;padding:5px;background:#fff;
    border:1px solid #d7dfe9;border-radius:10px;box-shadow:0 10px 26px rgba(18,38,63,.18)}
  .ctx .hd{padding:4px 10px 6px;font-size:11.5px;color:var(--muted);border-bottom:1px solid #eef1f6;margin-bottom:4px}
  .ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;
    border-radius:6px;font-size:12.5px;color:var(--ink);cursor:pointer}
  .ctx button:hover{background:#eef3fa}
  .ctx button.danger{color:#c92a2a}
</style>
</head>
<body>
<div class="app">
  <header class="pane menubar">
    <div class="brand">双花瓣配电网 <em>仿真工作台</em></div>
    <nav class="mn" id="mn">
      <button class="mnu" data-m="file">文件</button>
      <button class="mnu" data-m="edit">编辑</button>
      <button class="mnu" data-m="view">视图</button>
      <button class="mnu" data-m="topo">拓扑</button>
      <button class="mnu" data-m="drill">演练</button>
      <button class="mnu" data-m="help">帮助</button>
    </nav>
    <span class="sep"></span>
    <span class="qk">
      <button id="bAllClose" title="所有开关合闸（不校验）">全部合闸</button>
      <button id="bAllOpen" title="所有开关分闸（不校验）">全部分闸</button>
      <button id="bReset" title="恢复当前模板的初始状态">复位拓扑</button>
      <button id="bUndo" title="撤销（Ctrl+Z）">撤销</button>
    </span>
    <span class="sep"></span>
    <span class="qk">
      <button id="bOut" class="primary" title="让每座开关站的 4 回出线一律背向花瓣中心，环网走向更清楚">出线朝外 ✓</button>
      <span class="ctl">图元大小 <input type="range" id="rSz" min="55" max="130" step="5" value="80"><b id="lSz">80%</b></span>
    </span>
    <span class="hint" id="hint"></span>
    <button id="bFocus" class="ghost">⛶ 专注画布</button>
  </header>

  <div class="mid" id="mid">
    <aside class="side">
      <div class="pane box">
        <b>拓扑模板</b>
        <div class="topos" id="topoList"></div>
        <div class="row" style="margin-top:8px">
          <button id="bSaveLocal" class="mini" title="把当前拓扑存到浏览器本地">保存到本地</button>
          <button id="bOpenLocal" class="mini" title="打开本地存档">本地存档…</button>
          <button id="bExportPng" class="mini" title="把画布导出为 PNG">导出 PNG</button>
        </div>
        <div class="kv" id="topoMsg">模板可自由编辑，改完可保存到本地或导出 JSON。</div>
      </div>

      <div class="pane box">
        <b>故障演练 · 场景库</b>
        <select id="selScene" title="预置故障场景"></select>
        <div class="row" style="margin-top:9px">
          <button id="bPlay" class="primary">▶ 自动演示</button>
          <button id="bStep">单步</button>
          <button id="bClearFault">复位运行方式</button>
        </div>
        <div class="row">
          <button id="bFault" class="mini">① 模拟故障</button>
          <button id="bIso" class="mini">② 隔离故障</button>
          <button id="bRestore" class="mini">③ 转供恢复</button>
          <button id="bImpFault" class="mini">导入故障点…</button>
        </div>
        <div class="tl" id="tlRow">
          <span class="chip on" data-s="0">正常运行</span>
          <span class="chip" data-s="1">① 故障发生 · 保护动作</span>
          <span class="chip" data-s="2">② 故障隔离</span>
          <span class="chip" data-s="3">③ 转供恢复供电</span>
        </div>
        <div class="tlmsg" id="tlMsg">尚未开始</div>
        <div class="impbox" id="impBox">
          <textarea id="impTxt" spellcheck="false" placeholder="每行一个故障点，格式：名称 | 目标
目标可以是：电缆编号 w18 ；开关站 A2 ；端子 A3:in2
例：
环网主干 A1-A2 故障 | w18
A2 母线故障 | A2"></textarea>
          <div class="improw">
            <button id="bImpGo">载入为场景</button>
            <button id="bImpCancel">取消</button>
          </div>
          <div class="kv" id="impHint"></div>
        </div>
      </div>

      <div class="pane box">
        <b>图例</b>
        <div class="legend">
          <span><svg width="30" height="18"><rect x="7" y="3" width="16" height="12" rx="2" fill="#f4f7fb" stroke="#334155" stroke-width="1.5"/><line x1="15" y1="5" x2="15" y2="13" stroke="#334155" stroke-width="3"/></svg>变电站（10 kV 电源）</span>
          <span><svg width="34" height="18"><line x1="4" y1="9" x2="30" y2="9" stroke="#1d4ed8" stroke-width="3"/><line x1="11" y1="9" x2="11" y2="4" stroke="#1d4ed8" stroke-width="1.6"/><line x1="23" y1="9" x2="23" y2="4" stroke="#1d4ed8" stroke-width="1.6"/><line x1="7" y1="9" x2="7" y2="14" stroke="#1d4ed8" stroke-width="1.6"/><line x1="14" y1="9" x2="14" y2="14" stroke="#1d4ed8" stroke-width="1.6"/><line x1="20" y1="9" x2="20" y2="14" stroke="#1d4ed8" stroke-width="1.6"/><line x1="27" y1="9" x2="27" y2="14" stroke="#1d4ed8" stroke-width="1.6"/></svg>开关站（2 进 4 出）</span>
          <span><svg width="22" height="18"><path d="M3 3 L19 3 L11 16 Z" fill="#dbe7ff" stroke="#1d4ed8" stroke-width="1.5"/></svg>配电房（负荷）</span>
          <span><svg width="24" height="18"><line x1="2" y1="9" x2="22" y2="9" stroke="#1d4ed8" stroke-width="2"/><rect x="8" y="4" width="8" height="11" rx="1.5" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/></svg>开关合闸</span>

/* ================= 数据 ================= */
var DEV={},ORDER=[],WIRES=[],SEQ=0,UNDO=[],SEL=null,EN={},SRC=[],SIM={},FLOW={},DEADSRC={},
    FAULT=null,drag=null,PREV=null,CLIP=null,SHOW_FLOW=true,SHOW_GLOW=true;
var TOPO={kind:'petal2',name:'双花瓣',desc:'',rings:['A','B'],badges:[],radial:false};
var OUTLINES=[];

function addDev(o){ o.terms=o.terms.map(function(t){ if(t.sw===undefined) t.sw=true; return t; });
  DEV[o.id]=o; ORDER.push(o.id); return o; }
function clearArr(a){ a.length=0; return a; }
function findTermObj(d,t){ var x=DEV[d]; if(!x) return null;
  for(var i=0;i<x.terms.length;i++) if(x.terms[i].id===t) return x.terms[i]; return null; }
function findWire(id){ for(var i=0;i<WIRES.length;i++) if(WIRES[i].id===id) return WIRES[i]; return null; }
function xf(d,lx,ly){ var y=d.flip?-ly:ly, r=d.rot*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  return [d.x+lx*c-y*s, d.y+lx*s+y*c]; }
function dirW(d,t){ var r=d.rot*Math.PI/180,c=Math.cos(r),s=Math.sin(r),lx=t.dir[0],
  ly=d.flip?-t.dir[1]:t.dir[1];
  return [lx*c-ly*s, lx*s+ly*c]; }
function kOf(d){ return d.type==='sub'?1:SZ; }
function tp(d,t){ var k=kOf(d); return xf(d,t.tx*k,t.ty*k); }
var DROP=140, MINSEP=46;
function placeLoads(){
  var grp={};
  ORDER.forEach(function(id){ var d=DEV[id];
    if(d.type!=='ld'||!d.host||!DEV[d.host]) return;
    var h=DEV[d.host], t=findTermObj(d.host,d.hterm); if(!t) return;
    var p=tp(h,t), g=grp[d.host]||(grp[d.host]=[]);
    g.push({d:d,x:p[0],y:p[1]+(h.flip?-DROP:DROP)});
  });
  for(var k in grp){ var a=grp[k].sort(function(u,v){ return u.x-v.x; });
    if(a.length===2&&a[1].x-a[0].x<MINSEP){
      var m=(a[0].x+a[1].x)/2; a[0].x=m-MINSEP/2; a[1].x=m+MINSEP/2; }
    var hp=(DEV[k]&&DEV[k].flip)?1:0;
    a.forEach(function(o){ o.d.x=Math.round(o.x); o.d.y=Math.round(o.y); o.d.flip=hp; }); }
}
function T(d,t){ return DEV[d]&&findTermObj(d,t); }
function hasWire(a,b){ var k1=a[0]+':'+a[1], k2=b[0]+':'+b[1];
  return WIRES.some(function(w){ var x=w.a.d+':'+w.a.t, y=w.b.d+':'+w.b.t;
    return (x===k1&&y===k2)||(x===k2&&y===k1); }); }
function wire(a,b){ if(hasWire(a,b)) return; WIRES.push({id:'w'+(++SEQ),a:{d:a[0],t:a[1]},
  b:{d:b[0],t:b[1]},bias:[0,0]}); }
function open(dev,ids){ ids.forEach(function(i){ var t=findTermObj(dev,i); if(t) t.sw=false; }); }

function build(){
  clearArr(ORDER); clearArr(WIRES); clearArr(OUTLINES); SEQ=0; SEL=null; UNDO=[]; PREV=null;
  FAULT=null; DEADSRC={}; CLIP=null; OUT=true;
  for(var _k in DEV) delete DEV[_k];
  var L=LAYOUTS[TOPO.kind]||LAYOUTS.petal2;
  TOPO.name=L.name; TOPO.desc=L.desc; TOPO.rings=L.rings.slice(); TOPO.radial=!!L.radial;
  TOPO.badges=[];

  SRC=L.src.slice();

}
/* 切换拓扑模板 */
function loadTopo(k){ if(!LAYOUTS[k]||k===TOPO.kind&&false){} if(!LAYOUTS[k]) return;
  demoStop(); TOPO.kind=k; build(); Z=1; CX=800; CY=450; zoomFit(); paint();
  SCENES=scenesDefault(); SCENES=SCENES.filter(function(x){ return !!sceneTarget(x); });
  fillScenes(); setTl(0);
  var b=document.getElementById('bOut'); if(b){ b.textContent='出线朝外 ✓'; b.className='primary'; }
  fmsg('已加载模板：'+TOPO.name+'（'+TOPO.desc+'）');
}
/* ================= 仿真：并查集 + BFS 潮流 ================= */
function simulate(){
  var p={},keys=[];
  function find(a){ if(p[a]===undefined){p[a]=a;keys.push(a);}
    while(p[a]!==a){ p[a]=p[p[a]]; a=p[a]; } return a; }
  function uni(a,b){ a=find(a); b=find(b); if(a!==b) p[b]=a; }
  ORDER.forEach(function(id){
    var d=DEV[id];
    find(id+':bus');
    d.terms.forEach(function(t){ var k=id+':'+t.id; find(k); if(t.sw) uni(k,id+':bus'); });
  });
  WIRES.forEach(function(w){ var a=w.a.d+':'+w.a.t, b=w.b.d+':'+w.b.t;
    if(p[a]===undefined||p[b]===undefined) return; uni(a,b); });
  var roots=SRC.filter(function(s){ return !DEADSRC[s]; })
             .map(function(s){ return find(s+':bus'); });
  EN={};
  ORDER.forEach(function(id){
    var d=DEV[id];
    EN[id+':bus']=roots.indexOf(find(id+':bus'))>=0;
    d.terms.forEach(function(t){ EN[id+':'+t.id]=roots.indexOf(find(id+':'+t.id))>=0; });
  });
  SIM.paired = roots.length>1 && roots[0]===roots[1];
  SIM.parent=p; SIM.find=find;
  FLOW=flow(p,find);
  return SIM;
}
function flow(p,find){
  var adj={};
  function add(a,b,wid){ (adj[a]=adj[a]||[]).push([b,wid]); }
  ORDER.forEach(function(id){ var d=DEV[id];
    d.terms.forEach(function(t){ if(!t.sw) return; var k=id+':'+t.id;
      add(k,id+':bus',null); add(id+':bus',k,null); }); });
  WIRES.forEach(function(w){ var a=w.a.d+':'+w.a.t, b=w.b.d+':'+w.b.t;
    add(a,b,w.id); add(b,a,w.id); });
  var depth={}, q=[];
  SRC.forEach(function(s){ depth[s+':bus']=0; q.push(s+':bus'); });
  for(var i=0;i<q.length;i++){ var u=q[i];
    (adj[u]||[]).forEach(function(e){ if(depth[e[0]]===undefined&&p[e[0]]!==undefined){
      depth[e[0]]=depth[u]+1; q.push(e[0]); } }); }
  var dir={};
  WIRES.forEach(function(w){ var a=w.a.d+':'+w.a.t, b=w.b.d+':'+w.b.t;
    if(depth[a]===undefined||depth[b]===undefined) return;
    if(find(a)!==find(b)) return;
    if(depth[a]<depth[b]) dir[w.id]=1; else if(depth[b]<depth[a]) dir[w.id]=-1; });
  return {depth:depth,dir:dir};
}
function liveLoads(){ var n=0; ORDER.forEach(function(id){
  if(DEV[id].type==='ld'&&EN[id+':t']) n++; }); return n; }
function deadLoads(){ var n=0; ORDER.forEach(function(id){
  if(DEV[id].type==='ld'&&!EN[id+':t']) n++; }); return n; }
function impacted(did,tid){

/* ================= 走线（直角圆角；bias 为拖动后的偏移）================= */
function num(n){ return Math.round(n*10)/10; }
function simplify(pts){
  var out=[];
  pts.forEach(function(p){ var l=out[out.length-1];
    if(!l||Math.abs(l[0]-p[0])>0.01||Math.abs(l[1]-p[1])>0.01) out.push([p[0],p[1]]); });
  if(out.length<3) return out;
  var res=[out[0]];
  for(var i=1;i<out.length-1;i++){
    var a=res[res.length-1],b=out[i],c=out[i+1];
    if(Math.abs((b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]))>0.01) res.push(b);
  }
  res.push(out[out.length-1]);
  return res;
}
function pathOf(pts,r){
  if(pts.length<3) return 'M'+num(pts[0][0])+' '+num(pts[0][1])+' L'+num(pts[pts.length-1][0])+' '+num(pts[pts.length-1][1]);
  var d='M'+num(pts[0][0])+' '+num(pts[0][1]);
  for(var i=1;i<pts.length-1;i++){
    var p0=pts[i-1],p1=pts[i],p2=pts[i+1];
    var l1=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]), l2=Math.hypot(p2[0]-p1[0],p2[1]-p1[1]);
    if(l1<0.5||l2<0.5) continue;
    var rr=Math.min(r,l1/2,l2/2);
    var u1=[(p1[0]-p0[0])/l1,(p1[1]-p0[1])/l1], u2=[(p2[0]-p1[0])/l2,(p2[1]-p1[1])/l2];
    var a=[p1[0]-u1[0]*rr,p1[1]-u1[1]*rr], b=[p1[0]+u2[0]*rr,p1[1]+u2[1]*rr];
    d+=' L'+num(a[0])+' '+num(a[1])+' Q'+num(p1[0])+' '+num(p1[1])+' '+num(b[0])+' '+num(b[1]);
  }
  var e=pts[pts.length-1];
  return d+' L'+num(e[0])+' '+num(e[1]);
}
function route(A,da,B,db,bias){
  var bx=(bias&&bias[0])||0, by=(bias&&bias[1])||0, s=24;
  var A2=[A[0]+da[0]*s,A[1]+da[1]*s], B2=[B[0]+db[0]*s,B[1]+db[1]*s];
  var ha=Math.abs(da[0])>Math.abs(da[1]), hb=Math.abs(db[0])>Math.abs(db[1]);
  var pts;
  if(!ha&&!hb){                                   /* 两端竖直：进线—进线 / 出线—配电房 */
    var ahead=(B[1]-A[1])*da[1]>0;
    if(da[1]*db[1]<0){                            /* 一进一出：Z 形 */
      if(ahead){ pts=[A,A2,[B2[0],A2[1]],B2,B]; }
      else { var ym0=(A2[1]+B2[1])/2; pts=[A,A2,[A2[0],ym0],[B2[0],ym0],B2,B]; }
    } else if(ahead){                             /* 同向且在其正前方：直进直出 */
      pts=[A,A2,[A2[0],B2[1]],[B2[0],B2[1]],B2,B];
    } else {                                      /* 同向且在身后：U 形绕行（环网相邻站） */
      var yc=da[1]>0?Math.max(A2[1],B2[1]):Math.min(A2[1],B2[1]);
      pts=[A,A2,[A2[0],yc],[B2[0],yc],B2,B];
    }
  } else if(ha&&hb){                              /* 两端水平（变电站）*/
    if(Math.abs(A2[1]-B2[1])<20){
      var yy=A2[1]+(by!==0?by:36*(bx>=0?1:-1));
      pts=[A,A2,[A2[0],yy],[B2[0],yy],B];
    } else {
      var tx=(A2[0]+B2[0])/2+bx;
      pts=[A,A2,[tx,A2[1]],[tx,B2[1]],B];
    }
  } else if(!ha&&hb){                             /* A 竖直、B 水平 */
    var xj3=A2[0]+bx, yj3=B2[1]+db[1]*24+by;
    pts=[A,A2,[xj3,A2[1]],[xj3,yj3],[B2[0],yj3],B];
  } else {                                        /* A 水平、B 竖直 */
    var yj4=B2[1]+by;
    pts=[A,A2,[A2[0],yj4],[B2[0],yj4],B];
  }
  pts.splice(pts.length-1,0,B2);   /* 沿端子方向直进直出，保证线一定落到节点上 */
  pts=simplify(pts);
  return {pts:pts,d:pathOf(pts,11)};
}
function wpath(w){
  var dA=DEV[w.a.d], dB=DEV[w.b.d], tA=T(w.a.d,w.a.t), tB=T(w.b.d,w.b.t);
  if(!dA||!dB||!tA||!tB) return null;
  var A=tp(dA,tA), B=tp(dB,tB);
  var r=route(A,dirW(dA,tA),B,dirW(dB,tB),w.bias||[0,0]);
  r.A=A; r.B=B;
  return r;
}
function longestMid(pts){
  var bi=0,bl=-1;
  for(var i=0;i<pts.length-1;i++){
    var L=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);
    if(L>bl){ bl=L; bi=i; }
  }
  if(bl<20) return null;
  return [(pts[bi][0]+pts[bi+1][0])/2,(pts[bi][1]+pts[bi+1][1])/2,
          (pts[bi+1][0]-pts[bi][0])/bl,(pts[bi+1][1]-pts[bi][1])/bl];
}

/* ================= 故障演练 ================= */
function fmsg(s){ document.getElementById('faultMsg').textContent=s; }
function kd(k){ var q=k.split(':'); return {d:q[0],t:q[1]}; }
function kname(k){ var q=kd(k), t=findTermObj(q.d,q.t); return q.d+'·'+(t?t.n:''); }
function hops(fromKey,toKey){
  var adj={};
  function add(a,b){ (adj[a]=adj[a]||[]).push(b); }
  ORDER.forEach(function(id){ var d=DEV[id];
    d.terms.forEach(function(t){ if(!t.sw) return; var k=id+':'+t.id;
      add(k,id+':bus'); add(id+':bus',k); }); });
  WIRES.forEach(function(w){ var a=w.a.d+':'+w.a.t, b=w.b.d+':'+w.b.t; add(a,b); add(b,a); });
  var seen={}, q=[[fromKey,0]]; seen[fromKey]=1;
  for(var i=0;i<q.length;i++){ var u=q[i];
    if(u[0]===toKey) return u[1];
    (adj[u[0]]||[]).forEach(function(v){ if(!seen[v]){ seen[v]=1; q.push([v,u[1]+1]); } }); }
  return Infinity;
}
function otherEndOfWire(key){
  for(var i=0;i<WIRES.length;i++){ var w=WIRES[i], a=w.a.d+':'+w.a.t, b=w.b.d+':'+w.b.t;
    if(a===key) return b; if(b===key) return a; }
  return null;
}
/* 与故障元件仍保持电气连通的节点集合（用于"故障区间不得带电"闭锁） */
function zoneKeys(){
  var adj={};
  function add(a,b){ (adj[a]=adj[a]||[]).push(b); }
  ORDER.forEach(function(id){ var d=DEV[id];
    d.terms.forEach(function(t){ if(!t.sw) return; var k=id+':'+t.id;
      add(k,id+':bus'); add(id+':bus',k); }); });
  WIRES.forEach(function(w){ var a=w.a.d+':'+w.a.t, b=w.b.d+':'+w.b.t; add(a,b); add(b,a); });
  var seed=[];
  if(FAULT.kind==='wire'){ var w=findWire(FAULT.id);
    if(w) seed=[w.a.d+':'+w.a.t, w.b.d+':'+w.b.t]; }
  else seed=[FAULT.id+':bus'];
  var seen={}, q=[]; seed.forEach(function(k){ if(!seen[k]){ seen[k]=1; q.push(k); } });
  for(var i=0;i<q.length;i++){ var u=q[i];
    (adj[u]||[]).forEach(function(v){ if(!seen[v]){ seen[v]=1; q.push(v); } }); }
  return q;
}
function zoneLive(){
  for(var i=0;i<FAULT.zone.length;i++){ var k=FAULT.zone[i];
    if(k===SRC[0]+':bus'||k===SRC[1]+':bus') continue;   /* 电源母线是"源"，不作为带电判据 */
    if(EN[k]) return true; }
  return false;
}

/* ① 故障发生：保护只动作于"故障侧"电源，按电气距离取最近的一台 */
function setFault(){
  if(!SEL){ fmsg('请先点选一条电缆或一座开关站，再点“① 模拟故障”。'); return; }
  var probes=[], label='';
  if(SEL.kind==='wire'){
    var w=findWire(SEL.id); if(!w) return;
    probes=[w.a.d+':'+w.a.t, w.b.d+':'+w.b.t]; label='电缆故障';
  } else if(SEL.kind==='dev'){
    var d=DEV[SEL.id]; if(!d) return;
    probes=[d.id+':bus']; label=d.name+' 故障';
    if(d.type==='sub') DEADSRC[d.id]=true;      /* 变电站母线故障 → 该母线失电 */
  } else { fmsg('请先点选一条电缆或一座开关站。'); return; }
  FAULT={kind:SEL.kind,id:SEL.id,label:label,tripped:[],iso:[],restored:[],zone:[],msg:'',
         rf:SCENE_RF||null,tr:SCENE_TR,pre:JSON.stringify(snap())};
  var srcs=[];
  ['SUBA','SUBB'].forEach(function(s){ DEV[s].terms.forEach(function(t){
    if(t.sw) srcs.push(s+':'+t.id); }); });
  var best=Infinity, goal=probes[0];
  probes.forEach(function(pb){ srcs.forEach(function(sk){
    var h=hops(sk,pb); if(h<best){ best=h; goal=pb; } }); });
  var act=[];
  srcs.forEach(function(sk){ if(hops(sk,goal)===best) act.push(sk); });
  act.forEach(function(sk){ var q=kd(sk), t=findTermObj(q.d,q.t);
    if(t) t.sw=false; FAULT.tripped.push(sk); });
  /* 保护拒动 → 越级跳闸：跳开该电源站的全部出线 */
  var esc='';
  if(FAULT.rf&&act.indexOf(FAULT.rf)>=0){
    var sd=kd(FAULT.rf).d;
    FAULT.tripped=[]; FAULT.escalate=sd; DEADSRC[sd]=true;   /* 越级跳闸 → 该站全停 */
    DEV[sd].terms.forEach(function(t){ var k=sd+':'+t.id;
      if(k===FAULT.rf) return;                       /* 拒动开关保持合位 */
      if(t.sw){ t.sw=false; FAULT.tripped.push(k); } });
    esc=kname(FAULT.rf)+' 开关拒动 → 越级跳开本站全部出线，'+DEV[sd].name+'全停';
  }
  var names=FAULT.tripped.map(kname);
  FAULT.msg='① 保护动作：'+(esc?esc:('跳开 '+names.join('、')))+'，故障区间失电';
  push(); paint();
}
/* 瞬时性故障：重合闸成功 */
function reclose(){
  if(!FAULT) return;
  FAULT.reclosed=[];
  FAULT.tripped.forEach(function(k){ var q=kd(k), t=findTermObj(q.d,q.t);
    if(t&&!t.sw){ t.sw=true; FAULT.reclosed.push(k); } });
  simulate();
  FAULT.msg='② 重合闸成功：故障为瞬时性，自动重合后供电恢复，无需隔离与转供';
  push(); paint();
}
function transientEnd(){
  if(!FAULT) return;
  FAULT.msg='③ 供电恢复正常：瞬时性故障已消失，停电时间约 0.6 s，线路继续正常运行';
  paint();
}
/* ② 故障隔离：拉开故障区间两侧开关；开关拒动则该侧无法隔离 */
function doIso(){
  if(!FAULT){ fmsg('还没有故障点，请先点“① 模拟故障”。'); return; }
  FAULT.iso=[]; var names=[], ref=[];
  function openOne(dk,tk){
    var t=findTermObj(dk,tk); if(!t) return;
    var key=dk+':'+tk;
    if(FAULT.rf===key){ ref.push(key); return; }
    FAULT.iso.push(key); names.push(kname(key)); if(t.sw) t.sw=false;
  }
  if(FAULT.kind==='wire'){
    var w=findWire(FAULT.id); if(!w) return;
    openOne(w.a.d,w.a.t); openOne(w.b.d,w.b.t);
  } else {
    var d=DEV[FAULT.id]; d.terms.forEach(function(t){ openOne(d.id,t.id); });
  }
  var note='';
  if(ref.length){
    var up=otherEndOfWire(ref[0]);
    if(up&&FAULT.iso.indexOf(up)<0){ var q=kd(up), t2=findTermObj(q.d,q.t);
      if(t2){ t2.sw=false; FAULT.iso.push(up); names.push(kname(up)+'（越级）'); } }
    note='；'+ref.map(kname).join('、')+' 拒动，该侧无法隔离，故障区间扩大到该站';
  }
  FAULT.zone=zoneKeys();
  FAULT.msg='② 故障隔离：拉开 '+names.join('、')+note+'，故障区间已与系统解列';
  push(); paint();
}
/* ③ 转供：在"不并列、不向故障区间送电"的前提下最大化复电 */
function doRestore(){
  if(!FAULT){ fmsg('还没有故障点，请先点“① 模拟故障”。'); return; }
  if(!FAULT.iso.length){ fmsg('请先执行“② 隔离故障区间”，否则合闸会重新送上故障。'); return; }
  simulate();
  FAULT.zone=zoneKeys();
  var before=deadLoads();
  FAULT.restored=[];
  for(var round=0;round<30;round++){
    simulate();
    var base=liveLoads(), best=null, bestGain=0, bestCost=9;
    var zl=zoneLive();
    ORDER.forEach(function(id){
      var d=DEV[id];
      d.terms.forEach(function(t){
        if(t.sw) return;
        if(FAULT.iso.indexOf(id+':'+t.id)>=0) return;
        t.sw=true; simulate();
        var ok=!SIM.paired && !zl && !zoneLive();
        var gain=liveLoads()-base;
        t.sw=false;
        var cost=(id==='SUBA'||id==='SUBB')?0:1;
        if(ok&&(gain>bestGain||(gain===bestGain&&gain>0&&cost<bestCost))){
          bestGain=gain; bestCost=cost; best=[id,t.id]; }
      });
    });
    if(!best) break;
    var bt=findTermObj(best[0],best[1]); bt.sw=true;
    FAULT.restored.push(best[0]+':'+best[1]);
  }
  simulate();
  var names=FAULT.restored.map(kname);
  var now=deadLoads(), back=before-now;
  if(!names.length&&now){
    FAULT.why = FAULT.rf ? ('故障区间未完全隔离（'+kname(FAULT.rf)+' 拒动），带故障转供被闭锁，须人工隔离后再送电')
      : (FAULT.kind==='dev' ? '电源侧母线故障，本站不具备转供条件' : '无可用备用通道，转供容量不足');
  } else FAULT.why='';
  var hold=[];
  ORDER.forEach(function(id){ if(DEV[id].type==='ld'&&!EN[id+':t']) hold.push(DEV[id].name); });
  FAULT.msg='③ 转供恢复：'+(names.length?('合上 '+names.join('、')):'无需合闸')+'，恢复 '+back+' 个配电房'+
    (now?('；仍有 '+now+' 个未复电（'+hold.slice(0,3).join('、')+(hold.length>3?' 等':'')+
      (FAULT.why?('）——'+FAULT.why):'，位于故障区间或母线，须待修复）')):'；非故障段已全部恢复供电');
  push(); paint();
}
function clearFault(){
  var pre=FAULT&&FAULT.pre;
  FAULT=null; setTl(0);
  if(pre) load(JSON.parse(pre));
  else { simulate(); render(); panels(); }
}

  {c:'一、线路（电缆）故障',

  {c:'一、线路（电缆）故障',
   n:'L4 配电房分支电缆故障（A1 → 配电房）', t:mkW('A1:out1','A1_L1:t'),
   d:'分支电缆无专用开关，跳开甲站出线1；隔离后该配电房停电待修，其余转供复电。'},
  {c:'一、线路（电缆）故障',
   n:'L5 花瓣间联络电缆故障', t:mkW('A2:out4','B2:out4'),

  {c:'二、开关站故障',
   n:'K1 开关站 A2 母线故障', t:{kind:'dev',id:'A2'},
   d:'站内母线故障，A2 全站隔离，本站 2 个配电房停电待修（不可转供）。'},
  {c:'二、开关站故障',
   n:'K2 环网开关拒动（A3 进线1 拒动）', t:mkW('A2:in2','A3:in1'), rf:'A3:in1',
   d:'隔离时 A3 进线1 开关拒动，故障无法从 A3 侧切除，A3 全站停电待修；对比 L2 可见拒动的代价。'},
  {c:'三、电源（变电站）故障',
   n:'P1 变电站甲全站失电（10 kV 母线故障）', t:{kind:'dev',id:'SUBA'},
   d:'甲站全停，两回出线跳闸；花瓣Ⅰ 经跨花瓣联络开关由乙站转供。'},
  {c:'三、电源（变电站）故障',
   n:'P2 变电站乙全站失电（10 kV 母线故障）', t:{kind:'dev',id:'SUBB'},
   d:'乙站全停；花瓣Ⅱ 经跨花瓣联络开关由甲站转供。'},
  {c:'四、瞬时性故障（重合闸）', tr:true,
   n:'T1 环网主干瞬时故障（重合闸成功）', t:mkW('A1:in2','A2:in1'),
   d:'架空/电缆混合线路瞬时性故障，保护跳闸后自动重合成功，短时停电即恢复。'},
  {c:'五、保护 / 开关异常',
   n:'R1 甲站出线1 保护拒动（越级跳闸）', t:mkW('SUBA:f1','A1:in1'), rf:'SUBA:f1',
   d:'出线开关拒动，保护越级跳开甲站全部出线，甲站全停，由乙站经联络转供。'}
]; }
function resolveTarget(str){
  var w=findWire(str);
  if(w) return {kind:'wire',a:w.a.d+':'+w.a.t,b:w.b.d+':'+w.b.t};
  var p=str.split(':');
  if(p.length===2){
    var w2=wiresAtTerm(p[0],p[1]);
    if(w2) return {kind:'wire',a:w2.a.d+':'+w2.a.t,b:w2.b.d+':'+w2.b.t};
    if(DEV[p[0]]) return {kind:'term',id:str};
    return null;
  }
  return DEV[str]?{kind:'dev',id:str}:null;
}
function sceneTarget(s){
  var t=s.t;
  if(t.kind==='wire'){ var w=wireByEnds(t.a,t.b); return w?{kind:'wire',id:w.id}:null; }
  if(t.kind==='term'){ var p=t.id.split(':'); var w2=wiresAtTerm(p[0],p[1]);
    if(w2) return {kind:'wire',id:w2.id}; return DEV[p[0]]?{kind:'dev',id:p[0]}:null; }
  return DEV[t.id]?{kind:'dev',id:t.id}:null;
}
function fillScenes(){
  var sel=document.getElementById('selScene'); sel.innerHTML='';
  var g={},order=[];
  SCENES=SCENES.filter(function(x){ return !!sceneTarget(x); });
  SCENES.forEach(function(s,i){ var c=s.c||'其它';
    if(!g[c]){ g[c]=document.createElement('optgroup'); g[c].label=c; order.push(c); }
    var o=document.createElement('option'); o.value=String(i); o.textContent=s.n; g[c].appendChild(o); });
  order.forEach(function(c){ sel.appendChild(g[c]); });
}
function curScene(){ return SCENES[+document.getElementById('selScene').value]||null; }
function loadScene(s){
  var gt=sceneTarget(s);
  if(!gt){ fmsg('场景“'+s.n+'”的目标在当前拓扑里找不到（图元可能已被删除）。'); return false; }
  SEL=gt; SCENE_RF=s.rf||null; SCENE_TR=!!s.tr;
  setTlLabels(s.tr?'tr':'perm');
  simulate(); render(); panels(); return true;
}
var TLL={perm:['正常运行','① 故障发生 · 保护动作','② 故障隔离','③ 转供恢复供电'],
         tr:['正常运行','① 故障发生 · 保护跳闸','② 重合闸成功','③ 供电恢复正常']};
function setTlLabels(kind){
  var L=TLL[kind]||TLL.perm, c=document.querySelectorAll('#tlRow .chip');
  for(var i=0;i<c.length;i++) c[i].textContent=L[i]||'';
}
function setTl(n){
  var c=document.querySelectorAll('#tlRow .chip');
  for(var i=0;i<c.length;i++){ var k=+c[i].getAttribute('data-s');
    c[i].className='chip'+(k===n?' on':(k<n?' done':'')); }
}
function tlMsg(s){ document.getElementById('tlMsg').textContent=s; }
function tlText(n,tr){ if(tr) return n===1?'t≈0.10 s：保护跳闸，切除故障':
  n===2?'t≈0.60 s：自动重合闸成功':n===3?'t≈0.60 s：供电恢复，无需隔离与转供':'';
  return n===1?'t≈0.10 s：保护动作，切除故障侧电源':
  n===2?'t≈0.35 s：环网开关动作，隔离故障区间':
  n===3?'t≈1.20 s：联络/备用开关合闸，非故障段转供复电':''; }
function demoStop(){ if(DEMO.timer) clearTimeout(DEMO.timer); DEMO.timer=null; DEMO.playing=false; }
function advance(){
  var s=curScene(), tr=!!(s&&s.tr);
  if(DEMO.step>=3) return;
  if(DEMO.step===0){ if(!loadScene(s)){ demoStop(); return; } setFault(); }
  else if(DEMO.step===1){ if(tr) reclose(); else doIso(); }
  else { if(tr) transientEnd(); else doRestore(); }
  DEMO.step++;
  setTl(DEMO.step); tlMsg(tlText(DEMO.step,tr));
  if(DEMO.playing&&DEMO.step<3) DEMO.timer=setTimeout(advance,1600);
  else DEMO.playing=false;
}
function demoPlay(){
  demoStop(); clearFault(); DEMO.step=0; setTl(0);
  DEMO.playing=true; tlMsg('自动演示中…');
  advance();
}
function demoReset(){ demoStop(); clearFault(); DEMO.step=0; setTl(0); tlMsg('尚未开始');
  setTlLabels('perm'); fmsg('已复位：故障清除，恢复正常运行方式。'); }
function parseFaultLines(txt){
  var out=[];
  txt.split('\n').forEach(function(line){
    if(!line.trim()) return;
    var p=line.split('|').map(function(x){ return x.trim(); });
    var tgt=p[p.length-1], nm=p.length>1?p[0]:('自定义故障 · '+tgt);
    var g=resolveTarget(tgt);
    if(g) out.push({c:'六、导入的故障点',n:nm,t:g,d:'由导入的故障点生成。'});
  });
  return out;
}
document.getElementById('bFault').onclick=function(){ demoStop(); setFault(); };
document.getElementById('bIso').onclick=function(){ demoStop(); doIso(); };
document.getElementById('bRestore').onclick=function(){ demoStop(); doRestore(); };
document.getElementById('bClearFault').onclick=demoReset;
document.getElementById('bPlay').onclick=demoPlay;
document.getElementById('bFocus').onclick=function(){
  var m=document.getElementById('mid'); m.classList.toggle('focus');
  this.textContent=m.classList.contains('focus')?'⛶ 退出专注':'⛶ 专注画布';
};
document.getElementById('bStep').onclick=function(){ demoStop(); if(DEMO.step>=3) DEMO.step=0; advance(); };
document.getElementById('selScene').onchange=function(){ demoStop(); DEMO.step=0; clearFault(); setTl(0);
  var s=curScene(); tlMsg('尚未开始');
  if(s){ loadScene(s); fmsg(s.n+'：'+s.d); } };
document.getElementById('bImpFault').onclick=function(){
  var b=document.getElementById('impBox'); b.style.display=(b.style.display==='block')?'none':'block'; };
document.getElementById('bImpCancel').onclick=function(){ document.getElementById('impBox').style.display='none'; };
document.getElementById('bImpGo').onclick=function(){
  var list=parseFaultLines(document.getElementById('impTxt').value);
  var hint=document.getElementById('impHint');
  if(!list.length){ hint.textContent='没有解析出有效故障点，检查一下格式（名称 | 目标）。'; return; }
  list.forEach(function(s){ SCENES.push(s); });
  fillScenes();
  document.getElementById('selScene').value=String(SCENES.length-1);
  hint.textContent='已载入 '+list.length+' 个故障点';
  document.getElementById('impBox').style.display='none';
  fmsg('已导入 '+list.length+' 个故障点，可在下拉框中逐个演示。');
};

/* ================= 面板 ================= */
function refresh(){ simulate(); render(); }
function paint(){ simulate(); render(); panels(); faultPanel(); actionPanel(); }
function faultPanel(){
  if(!FAULT) return;
  var s='【'+FAULT.label+'】'+(FAULT.msg||'');
  if(FAULT.iso&&FAULT.iso.length&&!(FAULT.restored&&FAULT.restored.length))
    s+='（已隔离 '+FAULT.iso.length+' 处）';
  fmsg(s+'　|　当前失电配电房 '+deadLoads()+' 个');
}
function panels(){
  var nLoad=0,nDead=0,dead=[],nOpen=0,nTie=0,nIso=0,nSp=0,used={};
  WIRES.forEach(function(w){ used[w.a.d+':'+w.a.t]=1; used[w.b.d+':'+w.b.t]=1; });
  ORDER.forEach(function(id){
    var d=DEV[id];
    d.terms.forEach(function(t){
      if(!t.sw){ nOpen++; if(t.tie) nTie++; }
      if(!used[id+':'+t.id]&&d.type==='sta'&&t.k==='sp') nSp++;
      if(t.k==='load'){ nLoad++; if(!EN[id+':'+t.id]){ nDead++; dead.push(d.name); } }
    });
    if(d.type==='sta'&&!EN[id+':bus']) nIso++;
  });
  var nSta=ORDER.filter(function(i){ return DEV[i].type==='sta'; }).length;
  function ringOpen(pre){ var n=0;
    ORDER.forEach(function(id){ if(id.indexOf(pre)!==0) return;
      DEV[id].terms.forEach(function(t){ if(!t.sw&&t.k==='in') n++; }); });
    return n; }
  var deadSrc=SRC.filter(function(x){ return DEADSRC[x]; });
  document.getElementById('tags').innerHTML=
    '<span class="tag act"><i></i>'+esc(TOPO.name)+'</span>'+
    '<span class="tag '+(deadSrc.length?'bad':'ok')+'"><i></i>电源 <b>'+SRC.length+'</b> 座变电站'+
      (deadSrc.length?('（'+deadSrc.map(function(x){return DEV[x].name;}).join('、')+'失电）'):'')+'</span>'+
    '<span class="tag"><i></i>开关站 <b>'+nSta+'</b> 座</span>'+
    '<span class="tag"><i></i>配电房 <b>'+nLoad+'</b> 个</span>'+
    '<span class="tag '+(nDead?'bad':'ok')+'"><i></i>失电配电房 <b>'+nDead+'</b> 个</span>'+
    '<span class="tag '+(SIM.paired?'warn':'ok')+'"><i></i>运行方式 <b>'+(SIM.paired?'合环（并列）':'开环运行')+'</b></span>'+
    (FAULT?'<span class="tag warn"><i></i>故障演练中 <b>'+esc(FAULT.label||'')+'</b></span>':'');
  var chk=[], K=function(lv,t){ chk.push('<span class="al '+(lv||'')+'">'+t+'</span>'); };
  if(SIM.paired) K('bad','告警：甲、乙两站电源已并列 —— 应立即拉开一处联络/环网开关');
  else K('ok','无双电源并列，满足开环运行');
  if(nDead) K('bad','失电配电房 '+nDead+' 个：'+esc(dead.slice(0,4).join('、'))+(dead.length>4?' …':''));
  else K('ok','全部配电房正常供电');
  if(nIso) K('warn','失电开关站 '+nIso+' 座（两回进线均无电）');
  TOPO.rings.forEach(function(pre){ if(ringOpen(pre)===0)
    K('warn','环网 '+pre+' 未开环（闭环运行，需开一处环网开关）'); });
  if(TOPO.radial) K('warn','单辐射接线：无联络通道，故障段下游须停电待修复');
  if(nSp) K('','预留/备用出线间隔 '+nSp+' 个（未接线）');
  if(FAULT) K('warn','已设置故障点：'+esc(FAULT.label)+'（① 模拟 ② 隔离 ③ 恢复）');
  document.getElementById('pChk').innerHTML=chk.join('');


  var box=document.getElementById('pSel');
  if(document.activeElement&&document.activeElement.id==='pInName'){
    document.getElementById('hint').textContent='图元 '+ORDER.length+' 个 · 连线 '+WIRES.length+' 条';
    return;
  }
  if(!SEL){ box.innerHTML='<div class="kv">未选中。<b>拖动图元</b>移动 · <b>拖动电缆</b>可改走线位置 · 点开关分/合 · 从端子拖到端子接线 · <b>右键</b>弹菜单。</div>'; }
  else if(SEL.kind==='wire'){
    box.innerHTML='<div class="kv">已选中电缆 <i>'+SEL.id+'</i></div>'+
      '<div class="kv">直接拖动可调整走线位置；右键可“复位走线 / 设为故障点 / 删除”。</div>';
  } else if(SEL.kind==='term'){
    var p=SEL.id.split(':');
    box.innerHTML='<div class="kv">端子：<i>'+p[0]+' · '+((findTermObj(p[0],p[1])||{}).n)+'</i></div>'+
      '<div class="kv">状态：'+(EN[SEL.id]?'<i class="ok">带电</i>':'<i class="bad">失电</i>')+'</div>'+
      '<div class="kv">可从这里拖到另一个端子完成接线</div>';
  } else {
    var d=DEV[SEL.id];
    var h='<div class="row"><span class="kv">名称</span><input type="text" id="pInName" value="'+
      d.name.replace(/"/g,'&quot;')+'"></div>'+
      '<div class="row"><span class="kv">类型</span><i>'+TYPE[d.type]+'</i>'+
      (d.type==='sta'
        ? '<button class="mini" data-act="flip">翻转（进/出线互换）</button>'
        : '<button class="mini" data-act="rot-">旋转 -15°</button><button class="mini" data-act="rot+">旋转 +15°</button>')+
      '<button class="mini" data-act="del">删除图元</button></div>'+
      '<div class="kv">母线：'+(EN[d.id+':bus']?'<i class="ok">带电</i>':'<i class="bad">失电</i>')+' · 所属：'+
      (d.pet==='b'?'花瓣Ⅱ':'花瓣Ⅰ')+'</div>';
    if(d.type!=='ld'){
      h+='<div class="kv" style="margin:5px 0 2px">开关清单（断开影响 = 通断分析）</div>';
      d.terms.forEach(function(t){
        var lost=impacted(d.id,t.id);
        var note = t.sw ? (lost.length? '断开将失电 '+lost.length+' 个配电房' : '断开后仍可由另一路供电')
                        : (t.tie?'常开联络开关':(isIso(d.id,t.id)?'已隔离':'已分位'));
        h+='<div class="sw"><span class="nm"><b>'+(t.tie?'★ ':'')+t.n+'</b> <em>'+(t.sw?'合':'分')+'</em></span>'+
           '<span><button class="mini" data-act="sw" data-t="'+t.id+'">'+(t.sw?'分闸':'合闸')+'</button> '+
           '<em class="'+(t.sw&&lost.length?'warn':'')+'">'+note+'</em></span></div>';
      });
    }
    box.innerHTML=h;
  }
  document.getElementById('hint').textContent='图元 '+ORDER.length+' 个 · 连线 '+WIRES.length+' 条';
}
var pSel=document.getElementById('pSel');
pSel.addEventListener('click',function(ev){
  var b=ev.target.closest?ev.target.closest('button[data-act]'):null;
  if(!b||!SEL||SEL.kind!=='dev') return;
  var d=DEV[SEL.id], a=b.dataset.act;
  if(a==='sw') toggle(SEL.id,b.dataset.t);
  else if(a==='del') delDev(SEL.id);
  else if(a==='rot-'||a==='rot+'){ push(); d.rot+=(a==='rot+'?15:-15); paint(); }
  else if(a==='flip'){ push(); d.flip=d.flip?0:1; placeLoads(); paint(); }
});
pSel.addEventListener('input',function(ev){
  if(ev.target.id!=='pInName'||!SEL||SEL.kind!=='dev') return;
  DEV[SEL.id].name=ev.target.value; refresh();
});

build(); paint();
SCENES=scenesDefault(); fillScenes(); setTl(0);
window.__api={snap:snap,load:load,DEV:DEV,WIRES:WIRES,simulate:simulate,T:T,impacted:impacted,
  hops:hops,SIM:function(){return SIM;},FLOW:function(){return FLOW;},EN:function(){return EN;},
  setFault:setFault,doIso:doIso,doRestore:doRestore,getFault:function(){return FAULT;},
  liveLoads:liveLoads,deadLoads:deadLoads,
  dev:function(){return DEV;},wires:function(){return WIRES;},
  TOPO:function(){return TOPO;},loadTopo:loadTopo,zoomFit:zoomFit,Z:function(){return Z;}};
})();
</script>
